# Checks every push and pull request. A push to develop or main that passes both checks also
# publishes the app image to GHCR:
#
#   ghcr.io/yuri-nagasaki/wuwa-emotes:<first 7 characters of the commit>   what deploy/release.sh rolls out
#   ghcr.io/yuri-nagasaki/wuwa-emotes:<branch>                             newest image of develop / main
#
# Never :latest. On the server that tag is the local pointer that only deploy/rollout.sh moves.
# The server builds nothing: it checks out the public repository and pulls these images.
#
# Third-party actions are pinned to commit SHAs (release in the comment), service images to a version
# and digest, downloaded tools to a SHA-256. Every pin was at least two weeks old when it was chosen.
name: ci

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer pull request run replaces the running one. Branch pushes run one at a time instead, so the
  # :develop / :main tags only move forward (a waiting push run is still replaced by a newer push).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/yuri-nagasaki/wuwa-emotes

jobs:
  check:
    name: typecheck, tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The same services, credentials and loopback ports as compose.dev.yaml, which the tests expect.
    services:
      pg:
        image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
        env:
          POSTGRES_USER: chaochi
          POSTGRES_PASSWORD: chaochi
          POSTGRES_DB: chaochi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chaochi -d chaochi"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      s3:
        image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
        env:
          RUSTFS_ACCESS_KEY: devaccess
          RUSTFS_SECRET_KEY: devsecret123
          RUSTFS_VOLUMES: /data
          RUSTFS_ADDRESS: ":9000"
        ports: ["9000:9000"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3

      # tests/media/backup.test.ts runs pg_dump against the PostgreSQL 18 service. The runner's own
      # client is older and pg_dump refuses a newer server, so install 18 from PGDG and put it first.
      - name: PostgreSQL 18 client
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq --no-install-recommends postgresql-client-18 >/dev/null
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/pg_dump --version | grep -q ' 18\.'

      - run: bun install --frozen-lockfile

      # RustFS has no health check: s3-init (as in compose.dev.yaml) retries until it answers S3
      # requests. Every suite creates its own bucket; this one is the integration tests' default.
      - name: Wait for RustFS
        run: bun deploy/local/s3-init.ts
        env:
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_BUCKET: chaochi-test
          S3_ACCESS_KEY_ID: devaccess
          S3_SECRET_ACCESS_KEY: devsecret123

      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  secrets:
    name: gitleaks, full history
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c --quiet -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Without --log-opts gitleaks reads `git log -p --all`: every fetched branch and tag, and the
      # merge commit of a pull request. Findings are printed redacted.
      - name: Scan
        run: gitleaks git --config .gitleaks.toml --redact --verbose --no-banner .

  image:
    name: image to GHCR
    needs: [check, secrets]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tags
        id: tags
        run: |
          sha7=${GITHUB_SHA::7}
          {
            echo "sha7=$sha7"
            echo "tags<<EOF"
            echo "$IMAGE:$sha7"
            echo "$IMAGE:$GITHUB_REF_NAME"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          build-args: CHAOCHI_REVISION=${{ steps.tags.outputs.sha7 }}
          tags: ${{ steps.tags.outputs.tags }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          SHA7: ${{ steps.tags.outputs.sha7 }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "Published \`$IMAGE:$SHA7\` and \`$IMAGE:$GITHUB_REF_NAME\` (\`$DIGEST\`)."
            echo
            echo "Release from a checkout of this repository: \`deploy/release.sh $SHA7\`"
          } >> "$GITHUB_STEP_SUMMARY"
